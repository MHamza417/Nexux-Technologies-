<ossec_config>
  <client>
    <server>
      <address>CHANGE_MANAGER_IP</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>intellisecops,docker</config-profile>
    <enrollment>
      <enabled>yes</enabled>
      <manager_address>CHANGE_MANAGER_IP</manager_address>
      <port>1515</port>
      <agent_name>intellisecops-backend</agent_name>
    </enrollment>
  </client>

  <localfile>
    <log_format>json</log_format>
    <location>/var/log/intellisecops/scan_metrics.json.log</location>
  </localfile>
  <localfile>
    <log_format>json</log_format>
    <location>/var/log/intellisecops/security_audit.json.log</location>
  </localfile>
</ossec_config>
